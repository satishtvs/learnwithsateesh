# Installed as /etc/nginx/sites-available/learnwithsateesh (a separate file from the portfolio's site).
# First install it as-is (HTTP only), then:
#   sudo certbot --nginx -d learnwithsateesh.in -d www.learnwithsateesh.in --redirect
# certbot adds the 443 server block and the HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name learnwithsateesh.in www.learnwithsateesh.in;

    root /var/www/lws/dist;
    index index.html;

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Hashed build assets can be cached hard
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # FastAPI (docker, bound to loopback)
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 5M;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
