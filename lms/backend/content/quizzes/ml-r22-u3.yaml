quizzes:
  # ------------------------------------------------------------------ Part 1
  - slug: u3-p1
    title: "Part 1: Decision trees, entropy and ID3"
    status: approved
    pass_percent: 70
    questions:
      - q: "A node holds 6 examples of class yes and 6 of class no. What is its entropy?"
        options:
          - "0 bits"
          - "0.5 bits"
          - "1 bit"
          - "2 bits"
        answer: C
        explain: "Two classes in equal parts give the maximum entropy for two classes, which is 1 bit. A pure node would have entropy 0."

      - q: "Splitting on 'Exam soon' gives two branches, each with entropy 0.65. The root entropy is 1.0. What is the information gain?"
        options:
          - "0.35"
          - "0.65"
          - "1.00"
          - "1.65"
        answer: A
        explain: "Gain = entropy before minus weighted entropy after = 1.0 - 0.65 = 0.35."

      - q: "At each node, which feature does the ID3 algorithm choose to split on?"
        options:
          - "The feature with the fewest values"
          - "The feature that appears first in the table"
          - "The feature with the lowest information gain"
          - "The feature with the highest information gain"
        answer: D
        explain: "ID3 is greedy: it picks the feature that removes the most uncertainty, that is, the one with the highest gain."

      - q: "Why can information gain be misleading for a feature like student roll number?"
        options:
          - "It has many values, so every leaf becomes pure and the gain looks huge, yet it is useless for prediction"
          - "It is a continuous feature, so entropy cannot be computed"
          - "It always has zero gain"
          - "It makes the tree too small"
        answer: A
        explain: "Gain favours features with many values. The gain ratio used in C4.5 corrects this."

      - q: "Which is a remedy when a decision tree overfits the training data?"
        options:
          - "Grow the tree until every leaf is pure"
          - "Stop growing early or prune the tree"
          - "Use entropy with logarithm to base 10"
          - "Remove the root node"
        answer: B
        explain: "A tree grown until pure memorises noise. Stopping early (pre-pruning) or cutting back branches (pruning) controls this."

      - q: "In the attendance example, which feature gave the highest information gain and became the root?"
        options:
          - "Weather"
          - "Bus"
          - "Day of the week"
          - "Exam soon"
        answer: D
        explain: "Exam soon had gain 0.35, against 0.1258 for Weather and 0.0817 for Bus, so ID3 puts it at the root."

      - q: "What does a leaf node of a decision tree hold?"
        options:
          - "A question about a feature"
          - "A class label for the examples that reach it"
          - "The entropy of the whole data set"
          - "The list of all features"
        answer: B
        explain: "Internal nodes ask questions and branches are the answers. A leaf gives the final class."

      - q: "Weather has gain 0.1258 and Bus has gain 0.0817. How much more gain does Weather have than Bus?"
        options:
          - "0.2075"
          - "0.1258"
          - "0.0441"
          - "0.0817"
        answer: C
        explain: "0.1258 - 0.0817 = 0.0441. Weather is better than Bus, but both lose to Exam soon (0.35)."

      - q: "Which method does C4.5 use to fix the bias of information gain towards features with many values?"
        options:
          - "Gain ratio"
          - "Random feature subsets"
          - "Gini impurity"
          - "Boosting"
        answer: A
        explain: "Gain ratio divides the gain by the split information, which punishes features that split into many small groups."

      - q: "What does each path from the root to a leaf represent?"
        options:
          - "A probability table"
          - "A distance between two points"
          - "A weight vector"
          - "An if-then rule"
        answer: D
        explain: "Following the answers along a path gives conditions joined by AND, and the leaf gives the result. This is why trees are easy to explain."

  # ------------------------------------------------------------------ Part 2
  - slug: u3-p2
    title: "Part 2: CART, Gini impurity and pruning"
    status: approved
    pass_percent: 70
    questions:
      - q: "A node has 3 examples of one class and 1 of the other. What is its Gini impurity?"
        options:
          - "0.25"
          - "0.375"
          - "0.5"
          - "0.75"
        answer: B
        explain: "G = 1 - (0.75^2 + 0.25^2) = 1 - 0.5625 - 0.0625 = 0.375."

      - q: "A split sends 4 examples left (Gini 0) and 6 examples right (Gini 0.2778). What is the weighted Gini?"
        options:
          - "0.2778"
          - "0.1111"
          - "0.4"
          - "0.1667"
        answer: D
        explain: "Weighted Gini = (4/10) x 0 + (6/10) x 0.2778 = 0.1667."

      - q: "How does CART differ from ID3 in the way it splits a node?"
        options:
          - "Every CART split is binary (two branches), while ID3 makes one branch per feature value"
          - "CART makes one branch per feature value, while ID3 is binary"
          - "CART never uses thresholds"
          - "CART can only handle classification"
        answer: A
        explain: "CART always asks a yes/no question, such as x <= t. ID3 in its basic form branches on every value of a discrete feature."

      - q: "In a regression tree, a leaf holds the targets 3.0, 3.4, 2.8 and 3.2. What does the leaf predict?"
        options:
          - "2.8"
          - "3.4"
          - "3.1"
          - "12.4"
        answer: C
        explain: "A regression leaf predicts the mean of its targets: (3.0 + 3.4 + 2.8 + 3.2) / 4 = 3.1."

      - q: "In cost complexity pruning (error + alpha x number of leaves), what does a larger alpha do?"
        options:
          - "It gives a bigger tree with more leaves"
          - "It gives a smaller tree, because size is punished more"
          - "It has no effect on the tree size"
          - "It changes the leaf values to the median"
        answer: B
        explain: "A large alpha makes each leaf costly, so pruning removes more branches and leaves a smaller tree."

      - q: "A node holds 5 examples, all from the same class. What is its Gini impurity?"
        options:
          - "0.5"
          - "1"
          - "0"
          - "0.25"
        answer: C
        explain: "G = 1 - 1^2 = 0. A pure node has zero impurity, just like zero entropy."

      - q: "In the worked example, how many candidate splits were compared to find study <= 3.5 as the best?"
        options:
          - "3"
          - "11"
          - "5"
          - "19"
        answer: B
        explain: "Eleven candidate splits were tried, and study <= 3.5 had the lowest weighted Gini, 0.1667."

      - q: "Where does CART place the candidate thresholds for a numeric feature?"
        options:
          - "Midway between neighbouring sorted values"
          - "At the largest value only"
          - "At random positions"
          - "At the mean of the whole data only"
        answer: A
        explain: "After sorting, each midpoint between two neighbouring values is tried as a threshold."

      - q: "Every cut in a CART tree is parallel to an axis. What shape of regions does the tree make in the input space?"
        options:
          - "Circles"
          - "Diagonal strips"
          - "Triangles only"
          - "Rectangles"
        answer: D
        explain: "Each question tests one feature against a threshold, so the regions are boxes (rectangles in 2-D)."

      - q: "A fully grown tree with 19 leaves scores train 1.000 and test 0.847. What does this show?"
        options:
          - "Underfitting"
          - "A perfect model"
          - "Overfitting, because the tree memorised the training data"
          - "That the data has no noise"
        answer: C
        explain: "A perfect training score with a lower test score means the tree learned noise. Pruning should reduce the gap."

  # ------------------------------------------------------------------ Part 3
  - slug: u3-p3
    title: "Part 3: Ensemble learning, bagging, random forests and boosting"
    status: approved
    pass_percent: 70
    questions:
      - q: "A bootstrap sample of N examples is drawn with replacement. Roughly what fraction of the distinct examples appears in it?"
        options:
          - "About 50%"
          - "About 63.2%"
          - "100%"
          - "About 90%"
        answer: B
        explain: "The chance that an item appears is 1 - (1 - 1/N)^N, which is close to 0.632 for large N. The rest are out-of-bag."

      - q: "Three independent classifiers are each correct with probability 0.6. How accurate is their majority vote?"
        options:
          - "0.600"
          - "0.720"
          - "0.648"
          - "0.900"
        answer: C
        explain: "Majority needs at least 2 correct: 3 x 0.6^2 x 0.4 + 0.6^3 = 0.432 + 0.216 = 0.648."

      - q: "What extra step makes a random forest different from plain bagging?"
        options:
          - "It trains the trees one after another"
          - "It uses only one tree"
          - "It gives each tree a random subset of features to consider at every split"
          - "It removes all noisy labels first"
        answer: C
        explain: "The random feature subset makes the trees less alike, so voting helps more."

      - q: "In AdaBoost, a stump has a weighted error of 0.2. What is its alpha, which is 0.5 ln((1 - error) / error)?"
        options:
          - "0.2"
          - "0.5"
          - "1.3863"
          - "0.6931"
        answer: D
        explain: "alpha = 0.5 ln(0.8 / 0.2) = 0.5 ln 4 = 0.6931."

      - q: "Which statement about bagging and boosting is correct?"
        options:
          - "Both train their models one after another"
          - "Bagging trains models in parallel and mainly reduces variance; boosting trains in sequence and mainly reduces bias"
          - "Boosting is more robust to noisy labels than bagging"
          - "Bagging uses weighted votes with alpha; boosting uses equal votes"
        answer: B
        explain: "Bagging is parallel with equal votes. Boosting is sequential with weighted votes and can chase noisy labels."

      - q: "In bagging, what does out-of-bag mean?"
        options:
          - "Examples that were not drawn into a tree's bootstrap sample"
          - "Examples drawn twice"
          - "Trees that gave the wrong vote"
          - "Features left out of the data"
        answer: A
        explain: "About 36.8% of the examples miss each bootstrap sample. They can be used to test that tree."

      - q: "A bootstrap sample of 1000 examples is drawn with replacement. About how many distinct examples does it contain?"
        options:
          - "About 500"
          - "About 368"
          - "About 632"
          - "About 900"
        answer: C
        explain: "About 63.2% of the distinct examples appear, so roughly 632 of 1000. The other 368 or so are out-of-bag."

      - q: "A random forest data set has d = 16 features. About how many features does each split consider?"
        options:
          - "About 2"
          - "About 8"
          - "All 16"
          - "About 4"
        answer: D
        explain: "The usual choice is about the square root of d, and sqrt(16) = 4."

      - q: "What is stacking?"
        options:
          - "Training the same tree many times on the same data"
          - "A meta-learner is trained to combine the predictions of several base models"
          - "Averaging the data before training"
          - "Pruning trees one by one"
        answer: B
        explain: "In stacking, the outputs of the base models become the inputs of a second model that learns how to combine them."

      - q: "Why does an ensemble help only when its models make different errors?"
        options:
          - "Because different models train faster"
          - "Because voting needs an even number of models"
          - "If all models make the same mistakes, voting just repeats the mistake"
          - "Because errors cancel only in boosting"
        answer: C
        explain: "Independent errors get outvoted, as in the three 60% voters giving 0.648. Identical errors cannot be fixed by voting."

  # ------------------------------------------------------------------ Part 4
  - slug: u3-p4
    title: "Part 4: Basic statistics and Gaussian mixture models"
    status: approved
    pass_percent: 70
    questions:
      - q: "The variance of the hours studied by six students is 6.25. What is the standard deviation?"
        options:
          - "2.5"
          - "3.125"
          - "6.25"
          - "39.06"
        answer: A
        explain: "The standard deviation is the square root of the variance: sqrt(6.25) = 2.5."

      - q: "In a Gaussian mixture, what must be true about the weights pi_k?"
        options:
          - "They can be any real numbers"
          - "They are positive and add up to 1"
          - "They must all be equal"
          - "They add up to the number of points N"
        answer: B
        explain: "The weights are mixing proportions: probabilities of picking each component, so they sum to 1."

      - q: "What is the responsibility of component k for a point x_n?"
        options:
          - "The distance from x_n to the mean of component k"
          - "The variance of component k"
          - "The probability that component k produced x_n, given the current parameters"
          - "The number of points assigned to component k"
        answer: C
        explain: "Responsibility is a soft assignment: how likely it is that component k generated this point."

      - q: "Which describes one round of the EM algorithm for a Gaussian mixture?"
        options:
          - "Compute means first, then guess the responsibilities"
          - "E step: compute responsibilities; M step: re-estimate means, variances and weights using them"
          - "Assign each point fully to one cluster and stop"
          - "Choose the number of components K using the test set"
        answer: B
        explain: "EM alternates the two steps and the log-likelihood never decreases, though it may reach only a local maximum."

      - q: "For the 2-D data, BIC is 1320.48 for K = 1, 1145.62 for K = 2 and 1170.01 for K = 3. Which K is chosen?"
        options:
          - "K = 1"
          - "K = 3"
          - "K = 2"
          - "All three are equally good"
        answer: C
        explain: "A lower BIC is better, and K = 2 has the lowest value (1145.62)."

      - q: "For a Gaussian curve, about what share of values lies within 1 standard deviation of the mean?"
        options:
          - "50%"
          - "95.45%"
          - "99.73%"
          - "68.27%"
        answer: D
        explain: "The 68-95-99.7 rule: 68.27% within 1 sigma, 95.45% within 2 sigma, 99.73% within 3 sigma."

      - q: "Between which values does a correlation coefficient always lie?"
        options:
          - "-1 and +1"
          - "0 and 1"
          - "0 and 100"
          - "-100 and +100"
        answer: A
        explain: "Correlation is the covariance divided by both standard deviations, which forces it into the range -1 to +1."

      - q: "In a Gaussian mixture, which quantity is the hidden (latent) variable?"
        options:
          - "The mean of the data"
          - "The number of data points N"
          - "Which component produced each data point"
          - "The value of BIC"
        answer: C
        explain: "We see only the points, not which component made them. Responsibilities are our soft guess for this hidden choice."

      - q: "What happens to the log-likelihood during the EM algorithm?"
        options:
          - "It always decreases"
          - "It never decreases, but it may stop at a local maximum"
          - "It always reaches the global maximum"
          - "It stays fixed after the E step"
        answer: B
        explain: "Each E and M step can only improve or keep the log-likelihood. Restarting from several guesses helps avoid poor local maxima."

      - q: "A mixture has three components. Two weights are pi_1 = 0.5 and pi_2 = 0.3. What is pi_3?"
        options:
          - "0.8"
          - "0.5"
          - "0.3"
          - "0.2"
        answer: D
        explain: "The weights must add up to 1, so pi_3 = 1 - 0.5 - 0.3 = 0.2."

  # ------------------------------------------------------------------ Part 5
  - slug: u3-p5
    title: "Part 5: Nearest neighbour methods"
    status: approved
    pass_percent: 70
    questions:
      - q: "Why is k-NN called a lazy learning method?"
        options:
          - "It has no real training step; it stores the data and does the work when a query arrives"
          - "It uses very few training examples"
          - "It always uses k = 1"
          - "It trains a tree before predicting"
        answer: A
        explain: "k-NN keeps all training data and computes distances only at prediction time."

      - q: "For a new point, the 3 nearest neighbours have classes A, B and B. What does 3-NN predict?"
        options:
          - "A"
          - "A tie, so no answer"
          - "The class of the farthest point"
          - "B"
        answer: D
        explain: "Majority vote among the three: B has 2 votes, A has 1."

      - q: "What is the Manhattan distance between the points (1, 1) and (4, 5)?"
        options:
          - "5"
          - "7"
          - "4"
          - "25"
        answer: B
        explain: "Sum of absolute differences: |4 - 1| + |5 - 1| = 3 + 4 = 7. Euclidean is 5 and Chebyshev is 4."

      - q: "Why should features be scaled before using k-NN?"
        options:
          - "To make the training faster"
          - "To remove the need to choose k"
          - "Features with large numbers, such as income in rupees, would otherwise dominate the distance"
          - "To turn classification into regression"
        answer: C
        explain: "Without scaling, the feature with the largest numerical range decides almost the whole distance."

      - q: "What happens when k is very small, such as k = 1?"
        options:
          - "The boundary is jagged and follows noise (high variance)"
          - "The boundary is very smooth (high bias)"
          - "Training accuracy is always low"
          - "The model cannot predict anything"
        answer: A
        explain: "With k = 1 the model matches every training point (train accuracy 1.000) but generalises worse, test 0.833 in the example."

      - q: "In the worked example, for which value of k did the new point get class A?"
        options:
          - "k = 3"
          - "k = 1"
          - "k = 5"
          - "All values of k"
        answer: B
        explain: "k = 1 gives A, but k = 3 and k = 5 give B. The answer can change with k."

      - q: "What is the Chebyshev distance between (2, 1) and (6, 4)?"
        options:
          - "7"
          - "3"
          - "4"
          - "5"
        answer: C
        explain: "Chebyshev is the largest single difference: max(|6 - 2|, |4 - 1|) = max(4, 3) = 4."

      - q: "What is the curse of dimensionality for k-NN?"
        options:
          - "The data always gets smaller"
          - "The distance becomes negative"
          - "The value of k must be zero"
          - "In many dimensions the nearest and farthest points are almost equally far, so neighbours lose meaning"
        answer: D
        explain: "When distances look alike, the nearest neighbours are no more similar to the query than any other point."

      - q: "Which is a weakness of k-NN?"
        options:
          - "Prediction is slow and all training data must be stored"
          - "It cannot make curved boundaries"
          - "It needs a long training phase"
          - "It can only predict two classes"
        answer: A
        explain: "k-NN does all its work at query time and keeps the full data set, so prediction is slow and memory use is large."

      - q: "How should the value of k be chosen?"
        options:
          - "Always take k = 1"
          - "By cross-validation on the training data"
          - "Always take k equal to the number of features"
          - "By looking at the test set labels only"
        answer: B
        explain: "Small k gives high variance and large k gives high bias. Cross-validation finds a good middle value."

  # ------------------------------------------------------------------ Part 6
  - slug: u3-p6
    title: "Part 6: Unsupervised learning and k-means"
    status: approved
    pass_percent: 70
    questions:
      - q: "What is the key difference between unsupervised and supervised learning?"
        options:
          - "Unsupervised learning always gives a number as output"
          - "Unsupervised learning needs more labels"
          - "Supervised learning has no inputs"
          - "Unsupervised learning has only inputs with no targets and looks for structure such as groups"
        answer: D
        explain: "Clustering is the common unsupervised task: group similar points without any labels."

      - q: "What does the k-means algorithm try to minimise?"
        options:
          - "The number of clusters"
          - "The sum of squared distances from each point to its cluster centre (SSE)"
          - "The distance between the cluster centres"
          - "The number of iterations only"
        answer: B
        explain: "J, also called SSE, measures how tight the clusters are. A smaller J means tighter clusters."

      - q: "In pass 1 of the example, points (1,2), (2,3), (7,8) and (8,9) are assigned to centre A. What is the new centre A?"
        options:
          - "(4.5, 5.5)"
          - "(2.0, 3.0)"
          - "(8.0, 7.5)"
          - "(18, 22)"
        answer: A
        explain: "The update step takes the mean: x = (1+2+7+8)/4 = 4.5 and y = (2+3+8+9)/4 = 5.5."

      - q: "SSE for K = 1, 2, 3, 4 is 1748, 974, 287 and 240. By the elbow method, which K is best?"
        options:
          - "K = 1"
          - "K = 2"
          - "K = 4"
          - "K = 3"
        answer: D
        explain: "The big drops stop after K = 3; later clusters only split natural groups, so the bend (elbow) is at 3."

      - q: "Why is k-means++ used to choose the starting centres?"
        options:
          - "It guarantees SSE is zero"
          - "It removes the need for K"
          - "It spreads the initial centres out, so the run is less likely to get stuck in a bad local minimum"
          - "It makes k-means a supervised method"
        answer: C
        explain: "k-means only goes downhill, so bad starts can trap it. k-means++ picks each new centre far from the chosen ones."

      - q: "In which order are the two steps repeated in Lloyd's k-means algorithm?"
        options:
          - "Move the centres to the mean, then choose K"
          - "Compute the BIC, then assign points"
          - "Assign each point to its nearest centre, then move each centre to the mean of its points"
          - "Remove outliers, then compute entropy"
        answer: C
        explain: "After picking starting centres, k-means alternates the assign step and the update step until nothing changes."

      - q: "In the worked example, SSE was 228.00 after pass 1 and 136.75 after pass 2. By how much did it fall?"
        options:
          - "91.25"
          - "364.75"
          - "136.75"
          - "228.00"
        answer: A
        explain: "228.00 - 136.75 = 91.25. SSE never increases from pass to pass."

      - q: "Why does k-means always stop?"
        options:
          - "Because K is always 2"
          - "Because it uses a test set"
          - "Because it removes one point each pass"
          - "SSE never increases and there are only finitely many ways to group the points"
        answer: D
        explain: "An always-falling SSE cannot loop forever, but it may stop at a local minimum, not the best answer."

      - q: "Which is a limit of k-means?"
        options:
          - "It cannot handle numeric data"
          - "It needs K in advance and assumes roughly round clusters"
          - "It needs labels for every point"
          - "It only works with K = 2"
        answer: B
        explain: "k-means is also sensitive to outliers. A Gaussian mixture model is the soft-assignment alternative."

      - q: "How is the silhouette score used to choose K?"
        options:
          - "Choose the K with the lowest silhouette score"
          - "Choose K equal to the number of points"
          - "Choose the K with the highest silhouette score"
          - "Choose K where the score is exactly zero"
        answer: C
        explain: "A higher silhouette means points sit well inside their own cluster and far from other clusters."
