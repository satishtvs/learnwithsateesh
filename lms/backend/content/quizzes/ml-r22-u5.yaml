quizzes:
  # ------------------------------------------------------------------ Part 1
  - slug: u5-p1
    title: "Part 1: Reinforcement learning and the Getting Lost example"
    status: approved
    pass_percent: 70
    questions:
      - q: "In reinforcement learning, what feedback does the agent receive after an action?"
        options:
          - "The correct action for that state"
          - "A reward, a number saying how good the outcome was"
          - "A cluster label for the new state"
          - "A full list of all possible actions and their values"
        answer: B
        explain: "The agent is never told the best action; it only gets a reward and a new state and must work out good behaviour by trying."

      - q: "What is a policy?"
        options:
          - "The immediate reward after one action"
          - "The set of all states in the environment"
          - "A rule that chooses the action to take in each state"
          - "The factor that reduces the weight of later rewards"
        answer: C
        explain: "A policy maps states to actions (deterministic) or to action probabilities (stochastic). Finding a good policy is the aim of RL."

      - q: "In the Getting Lost grid with gamma = 0.9, the goal reward of +20 arrives after seven steps of -1. What is its discounted value, 20 x 0.9^7?"
        options:
          - "20.00"
          - "13.00"
          - "9.57"
          - "4.35"
        answer: C
        explain: "0.9^7 is about 0.4783, so 20 x 0.4783 is about 9.566. Adding the discounted penalties of -5.217 gives the return 4.349."

      - q: "What does a discount factor gamma close to 0 make the agent?"
        options:
          - "Short-sighted: it cares mostly about immediate rewards"
          - "Far-sighted: distant rewards count almost fully"
          - "Unable to receive any reward"
          - "Fully random in its choices"
        answer: A
        explain: "The weight of a reward k steps ahead is gamma^k, which dies out fast for small gamma. Gamma near 1 gives a far-sighted agent."

      - q: "A purely greedy player (epsilon = 0) on a three-lever slot machine ends with a low average reward. Why?"
        options:
          - "It explores too much and wastes pulls"
          - "It sticks with the first lever that looked better than its starting estimate and never tries the others"
          - "Its discount factor is too large"
          - "It is told the wrong action by a teacher"
        answer: B
        explain: "Without exploration the player never discovers the better lever. Epsilon-greedy with a small epsilon finds it and earns far more."

      - q: "Which part of the loop does the agent control directly?"
        options:
          - "The reward it receives"
          - "The next state chosen by the environment"
          - "Its own choice of action"
          - "The position of the ponds"
        answer: C
        explain: "The agent chooses only its action. The environment decides the reward and the new state."

      - q: "With epsilon = 0.1 in epsilon-greedy, how often does the player try a random lever?"
        options:
          - "About 1 time in 10"
          - "About 9 times in 10"
          - "Never"
          - "Every time"
        answer: A
        explain: "Epsilon is the probability of exploring. With 0.1 the player explores about 10 percent of the time and exploits the rest."

      - q: "With gamma = 0.9, a path gives rewards -1, -1, -5 (the last is a pond). What is the return -1 + 0.9(-1) + 0.9^2(-5)?"
        options:
          - "-7.00"
          - "-6.50"
          - "-4.05"
          - "-5.95"
        answer: D
        explain: "0.9^2 = 0.81, so the terms are -1, -0.9 and -4.05, which add up to -5.95."

      - q: "Why is credit assignment hard in reinforcement learning?"
        options:
          - "Rewards are always negative"
          - "The reward may arrive many steps after the action that earned it"
          - "The agent has no actions"
          - "Gamma is always 0"
        answer: B
        explain: "With a delayed reward the agent must work out which earlier actions were responsible for it."

      - q: "Which is a real difference between reinforcement learning and supervised learning?"
        options:
          - "RL uses labelled examples"
          - "RL never needs rewards"
          - "The data the agent sees depends on the policy it follows"
          - "RL has no states"
        answer: C
        explain: "In RL the agent's own actions decide which states it visits, so the data changes as the policy changes."

  # ------------------------------------------------------------------ Part 2
  - slug: u5-p2
    title: "Part 2: MDP, Bellman equation, Q-learning and Sarsa"
    status: approved
    pass_percent: 70
    questions:
      - q: "What does the Markov property say?"
        options:
          - "The next state and reward depend only on the current state and action"
          - "The next state depends on the whole history of states"
          - "Every action has the same reward"
          - "The discount factor must equal 1"
        answer: A
        explain: "That is why the state must contain everything useful: the past adds no extra information about what happens next."

      - q: "The cell next to the gate has value 20. Taking one step (reward -1) into it gives what value, using Bellman with gamma = 0.9?"
        options:
          - "19.0"
          - "17.0"
          - "18.0"
          - "14.3"
        answer: B
        explain: "Value = reward now + gamma x next value = -1 + 0.9 x 20 = 17."

      - q: "Which method needs a complete model of the world (the step function for every action in every cell)?"
        options:
          - "Q-learning"
          - "Sarsa"
          - "Value iteration"
          - "Epsilon-greedy exploration"
        answer: C
        explain: "Value iteration sweeps all cells using the model. Q-learning and Sarsa learn from experienced (state, action, reward, next state) steps only."

      - q: "With alpha = 0.5, gamma = 0.9, old Q = 0 and the best Q of the next state = 10, reward -1, what is the new Q-learning value?"
        options:
          - "8.00"
          - "-1.00"
          - "10.00"
          - "4.00"
        answer: D
        explain: "Target = -1 + 0.9 x 10 = 8. New Q = 0 + 0.5 x (8 - 0) = 4."

      - q: "How does the Sarsa target differ from the Q-learning target?"
        options:
          - "Sarsa ignores the reward"
          - "Sarsa uses the Q of the action actually taken next, not the best Q"
          - "Sarsa needs the transition probabilities"
          - "Sarsa has no learning rate"
        answer: B
        explain: "Sarsa is on-policy: it learns the value of the behaviour it really follows, including exploratory moves. Q-learning is off-policy and uses the maximum."

      - q: "What does Q(s, a) measure?"
        options:
          - "The reward of state s only"
          - "The probability of reaching state s"
          - "How many times action a was tried"
          - "The expected return of taking action a in state s and then following the policy"
        answer: D
        explain: "Q is a value for a state-action pair, while V(s) is a value for the state alone."

      - q: "A cell next to a cell of value 17 has step reward -1. With gamma = 0.9, what is its value by the Bellman equation?"
        options:
          - "15.3"
          - "16.0"
          - "14.3"
          - "13.0"
        answer: C
        explain: "Value = -1 + 0.9 x 17 = -1 + 15.3 = 14.3."

      - q: "When does value iteration stop sweeping the grid?"
        options:
          - "After exactly one sweep"
          - "When the values stop changing"
          - "When gamma reaches 1"
          - "When the agent reaches the goal once"
        answer: B
        explain: "Each sweep applies the Bellman rule to every cell. Once nothing changes, the values have converged."

      - q: "With alpha = 0.1, old Q = 5 and a target of 8, what is the new Q?"
        options:
          - "8.0"
          - "5.0"
          - "0.3"
          - "5.3"
        answer: D
        explain: "New Q = 5 + 0.1 x (8 - 5) = 5.3. A small alpha moves Q only a little toward the target."

      - q: "What does the optimal Bellman equation add to the plain one?"
        options:
          - "A maximum over actions"
          - "A sum over all earlier states"
          - "A random action"
          - "A learning rate"
        answer: A
        explain: "V*(s) = max over a of (r + gamma V*(s')): the best action is chosen at each state."

  # ------------------------------------------------------------------ Part 3
  - slug: u5-p3
    title: "Part 3: Sampling methods and Markov chain Monte Carlo"
    status: approved
    pass_percent: 70
    questions:
      - q: "In inverse transform sampling for an exponential distribution with rate 2, x = -ln(1 - u) / 2. For u = 0.5488, what is x (approximately)?"
        options:
          - "0.3979"
          - "0.5488"
          - "0.7957"
          - "1.1000"
        answer: A
        explain: "1 - u = 0.4512 and ln(0.4512) is about -0.7957, so x = 0.7957 / 2 = 0.3979."

      - q: "In rejection sampling with the envelope M = 1.5 and a uniform proposal, what is the expected acceptance rate?"
        options:
          - "1.5"
          - "0.5"
          - "0.3333"
          - "0.6667"
        answer: D
        explain: "The acceptance rate is 1/M = 1/1.5 = 0.6667. The video observed 6675 accepted out of 10000."

      - q: "How does importance sampling differ from rejection sampling?"
        options:
          - "It weights every sample by p(x)/q(x) instead of throwing samples away"
          - "It needs a Markov chain"
          - "It only works for discrete variables"
          - "It requires the inverse CDF"
        answer: A
        explain: "Importance sampling keeps all samples and corrects for the wrong distribution using weights. A poor q makes a few weights huge."

      - q: "What does the stationary distribution pi of a Markov chain satisfy?"
        options:
          - "pi P = 0"
          - "pi P = pi"
          - "pi + P = 1"
          - "pi is the first row of P"
        answer: B
        explain: "One more step of the chain leaves pi unchanged. MCMC builds a chain whose stationary distribution is the target."

      - q: "In the Metropolis algorithm, the ratio p(x')/p(x) is 0.4757. What happens?"
        options:
          - "The move is always accepted"
          - "The move is always rejected"
          - "The chain restarts from zero"
          - "The move is accepted with probability 0.4757, otherwise the chain stays"
        answer: D
        explain: "Accept with probability min(1, ratio). Only ratios matter, so p need be known only up to a constant. A rejected step still records the old point."

      - q: "If the number of samples N is made 4 times larger, the sampling error falls by about what factor?"
        options:
          - "It doubles"
          - "It falls to one quarter"
          - "It falls to about half"
          - "It does not change"
        answer: C
        explain: "The error shrinks like 1 over the square root of N, and the square root of 4 is 2."

      - q: "What is the main limitation of inverse transform sampling?"
        options:
          - "It is never exact"
          - "It needs an inverse CDF that you can compute"
          - "It needs a Markov chain"
          - "It only gives whole numbers"
        answer: B
        explain: "The method solves F(x) = u, so it works only when F can be inverted easily."

      - q: "In rejection sampling with M = 4, about how many of 1000 proposals are accepted?"
        options:
          - "250"
          - "400"
          - "750"
          - "40"
        answer: A
        explain: "The acceptance rate is 1/M = 0.25, so about 250 of 1000 are accepted."

      - q: "What goes wrong in Metropolis sampling if the proposal step is too large?"
        options:
          - "The chain moves too slowly but accepts everything"
          - "The chain becomes exact"
          - "Burn-in is no longer needed"
          - "Most proposals are rejected, so the chain often stays put"
        answer: D
        explain: "Far-away proposals usually land where p is small, so they are rejected. Too small a step instead moves slowly."

      - q: "What does Gibbs sampling do?"
        options:
          - "It accepts only half the proposals"
          - "It rejects every proposal"
          - "It updates one variable at a time from its conditional distribution and accepts every proposal"
          - "It needs the inverse CDF"
        answer: C
        explain: "Each variable is drawn from p(variable | all the others), so no accept or reject step is needed."

  # ------------------------------------------------------------------ Part 4
  - slug: u5-p4
    title: "Part 4: Graphical models: Bayesian networks and Markov random fields"
    status: approved
    pass_percent: 70
    questions:
      - q: "How many numbers are needed for the full joint distribution of 10 yes/no variables?"
        options:
          - "20"
          - "100"
          - "1023"
          - "10240"
        answer: C
        explain: "2^10 - 1 = 1023. A graphical model needs far fewer numbers because each variable depends on only a few others."

      - q: "In the rain, sprinkler, wet grass network, P(rain) = 0.2, P(no sprinkler | rain) = 0.99 and P(wet | rain, no sprinkler) = 0.8. What is P(rain, no sprinkler, wet)?"
        options:
          - "0.1584"
          - "0.2000"
          - "0.9900"
          - "0.0160"
        answer: A
        explain: "The joint is a product of P(node | parents): 0.2 x 0.99 x 0.8 = 0.1584."

      - q: "P(wet) = 0.44838 and P(rain, wet) = 0.16038. What is P(rain | wet)?"
        options:
          - "0.2000"
          - "0.1604"
          - "0.5000"
          - "0.3577"
        answer: D
        explain: "P(rain | wet) = 0.16038 / 0.44838 = 0.3577, higher than the prior 0.2 because wet grass is evidence for rain."

      - q: "What is explaining away?"
        options:
          - "Removing a node from the graph"
          - "Seeing one cause (sprinkler on) lowers belief in another cause (rain) of the same effect"
          - "Ignoring all observed variables"
          - "Dividing by the constant Z"
        answer: B
        explain: "Once the sprinkler explains the wet grass, rain is no longer needed, so P(rain) drops from 0.3577 to 0.0068."

      - q: "What do Markov random fields need that Bayesian networks do not?"
        options:
          - "Arrows between nodes"
          - "A directed acyclic graph"
          - "The normalising constant Z"
          - "Conditional probability tables"
        answer: C
        explain: "MRF potentials are not probabilities, so the product of potentials must be divided by Z. Bayesian network tables are already normalised."

      - q: "What does each node of a Bayesian network store?"
        options:
          - "A table P(node | parents)"
          - "A potential for each clique"
          - "The constant Z"
          - "Only the observed value"
        answer: A
        explain: "The joint distribution is the product of these tables over all nodes."

      - q: "In the chain A to B to C, what blocks the path between A and C?"
        options:
          - "Observing A"
          - "Observing C"
          - "Removing the arrow from A to B"
          - "Observing the middle node B"
        answer: D
        explain: "Once B is known, A tells us nothing more about C. For a collider the opposite happens: observing the middle node opens the path."

      - q: "Take P(rain) = 0.2, P(sprinkler | rain) = 0.01 and P(wet | rain, sprinkler) = 0.99. What is P(rain, sprinkler, wet)?"
        options:
          - "0.0198"
          - "0.00198"
          - "0.2010"
          - "0.9900"
        answer: B
        explain: "Multiply the three table entries: 0.2 x 0.01 x 0.99 = 0.00198."

      - q: "How does inference by enumeration work?"
        options:
          - "It picks the largest table entry"
          - "It deletes all the unobserved nodes"
          - "It adds the joint probabilities of all worlds that match the evidence, then divides"
          - "It samples one world at random"
        answer: C
        explain: "Add the worlds that match the question and the evidence, add the worlds that match the evidence alone, then divide."

      - q: "What does a Markov random field place on each clique?"
        options:
          - "A potential function"
          - "An arrow"
          - "A cluster label"
          - "A reward"
        answer: A
        explain: "The potentials are multiplied together and divided by Z to give a probability."

  # ------------------------------------------------------------------ Part 5
  - slug: u5-p5
    title: "Part 5: Hidden Markov models"
    status: approved
    pass_percent: 70
    questions:
      - q: "In a hidden Markov model, what do we actually observe?"
        options:
          - "The hidden states directly"
          - "The transition matrix"
          - "The observations emitted by the hidden states"
          - "The stationary distribution"
        answer: C
        explain: "The states are hidden; we see only the emissions (such as walk, shop, clean) and reason about the states from them."

      - q: "Which algorithm finds the most likely hidden state sequence?"
        options:
          - "Forward algorithm"
          - "Baum-Welch"
          - "Gibbs sampling"
          - "Viterbi algorithm"
        answer: D
        explain: "Viterbi takes the maximum instead of the sum and traces back through backpointers. The forward algorithm gives the likelihood."

      - q: "Day 1: alpha(Sunny) = 0.36, alpha(Rainy) = 0.04. Sunny to sunny is 0.7, rainy to sunny is 0.4, and sunny emits the day-2 observation with probability 0.3. What is alpha(day 2, Sunny)?"
        options:
          - "0.0804"
          - "0.2680"
          - "0.1080"
          - "0.4000"
        answer: A
        explain: "(0.36 x 0.7 + 0.04 x 0.4) x 0.3 = 0.268 x 0.3 = 0.0804."

      - q: "What is the main difference between the forward algorithm and Viterbi?"
        options:
          - "Forward uses the maximum, Viterbi uses the sum"
          - "Forward sums over previous states, Viterbi takes the maximum and remembers the best previous state"
          - "Forward learns parameters, Viterbi does not"
          - "They are identical"
        answer: B
        explain: "Both use the same trellis. Summing gives the total likelihood of the observations; maximising gives the single best path."

      - q: "What is guaranteed by Baum-Welch training?"
        options:
          - "The true parameters are recovered exactly"
          - "The log-likelihood never decreases, but it may reach only a local optimum"
          - "It always finishes in one iteration"
          - "It needs the hidden states to be known"
        answer: B
        explain: "Baum-Welch is an EM method: the likelihood rises or stays level each iteration, but a bad start can end in a local optimum."

      - q: "Which three things define an HMM?"
        options:
          - "Only the transition matrix A"
          - "Only the emission matrix B"
          - "The start probabilities pi, transition matrix A and emission matrix B"
          - "The observations alone"
        answer: C
        explain: "pi, A and B each have rows that sum to 1, and together they define the model."

      - q: "Which of the three HMM problems does Baum-Welch solve?"
        options:
          - "Learning the parameters from observations"
          - "Evaluating the likelihood of a sequence"
          - "Decoding the best state path"
          - "Sampling a new state"
        answer: A
        explain: "Evaluation uses the forward algorithm, decoding uses Viterbi, and learning uses Baum-Welch."

      - q: "Day 1: alpha(Sunny) = 0.36, alpha(Rainy) = 0.04. Sunny to rainy is 0.3, rainy to rainy is 0.6, and rainy emits the day-2 observation with probability 0.5. What is alpha(day 2, Rainy)?"
        options:
          - "0.1320"
          - "0.2680"
          - "0.0400"
          - "0.0660"
        answer: D
        explain: "(0.36 x 0.3 + 0.04 x 0.6) x 0.5 = 0.132 x 0.5 = 0.066."

      - q: "Why is the forward algorithm better than adding up every hidden path by brute force?"
        options:
          - "It gives a different answer"
          - "Its work grows in step with the sequence length, not exponentially"
          - "It ignores the emission matrix"
          - "It needs no transition matrix"
        answer: B
        explain: "The trellis reuses partial sums. In the example it matches the brute-force total over 16 paths, 0.011189."

      - q: "A row of the transition matrix is 0.7 for staying in sunny and x for moving to rainy. What is x?"
        options:
          - "0.7"
          - "0.4"
          - "0.3"
          - "0.1"
        answer: C
        explain: "Each row sums to 1, so x = 1 - 0.7 = 0.3."

  # ------------------------------------------------------------------ Part 6
  - slug: u5-p6
    title: "Part 6: Tracking: Kalman filter and particle filter"
    status: approved
    pass_percent: 70
    questions:
      - q: "What are the two steps of each Kalman filter cycle?"
        options:
          - "Sample and reject"
          - "Predict and update"
          - "Explore and exploit"
          - "Forward and backward"
        answer: B
        explain: "Predict moves the belief forward and uncertainty grows; update blends in the measurement and uncertainty shrinks."

      - q: "After the predict step the variance is P = 10.5 and the sensor noise variance is R = 4. What is the Kalman gain K = P / (P + R)?"
        options:
          - "0.2759"
          - "0.4000"
          - "0.7241"
          - "0.5000"
        answer: C
        explain: "K = 10.5 / 14.5 = 0.7241, so the update trusts the measurement a lot at the start."

      - q: "What happens to the Kalman gain over the first few steps in the example (0.7241, 0.4592, 0.3688, 0.3306)?"
        options:
          - "It rises, because measurements get better"
          - "It stays constant"
          - "It becomes negative"
          - "It falls, as the filter becomes more certain and trusts measurements less"
        answer: D
        explain: "As the variance of the belief shrinks, the filter relies more on its own estimate, so the gain falls and settles near 0.2965."

      - q: "In the particle filter, what is the purpose of resampling?"
        options:
          - "To make all particles more varied"
          - "To increase the sensor noise"
          - "To remove the need for a model"
          - "To drop low-weight particles and copy high-weight ones near the measurement"
        answer: D
        explain: "Resampling concentrates the particle cloud where the measurement says the state probably is."

      - q: "When would you prefer a particle filter over a Kalman filter?"
        options:
          - "When the model is non-linear or non-Gaussian"
          - "When speed is the only concern and the model is linear Gaussian"
          - "When there are no measurements"
          - "When you want an exact closed-form answer"
        answer: A
        explain: "The Kalman filter is fast and exact for linear Gaussian models. Particle filters work for any model but cost more computation."

      - q: "What is the tracking problem?"
        options:
          - "Estimating a hidden state, such as position, from noisy measurements"
          - "Labelling data with clusters"
          - "Choosing the best action from rewards"
          - "Sampling from a fixed distribution"
        answer: A
        explain: "The true state is hidden, so we combine a motion model with noisy measurements at each time step."

      - q: "What happens to the uncertainty during the Kalman predict step?"
        options:
          - "It becomes zero"
          - "It shrinks"
          - "It grows"
          - "It stays exactly the same"
        answer: C
        explain: "Predicting forward adds process noise, so we are less sure. The update step then shrinks the uncertainty again."

      - q: "The estimate is 10, the measurement is 12 and K = 0.7241. What is the updated estimate 10 + K x (12 - 10)?"
        options:
          - "10.72"
          - "11.45"
          - "12.00"
          - "11.00"
        answer: B
        explain: "10 + 0.7241 x 2 = 11.448, so it moves most of the way toward the measurement."

      - q: "In the example, the Kalman estimate has RMSE 1.13 and the raw measurements have RMSE 1.96. What does this show?"
        options:
          - "The raw measurements are better"
          - "Both are identical"
          - "The filter adds noise"
          - "The filter's estimate is closer to the truth than the noisy measurements"
        answer: D
        explain: "Blending the model with the measurements removes part of the noise, so the error is lower."

      - q: "In the example, what happened when the particle filter used only N = 20 particles?"
        options:
          - "It became exact"
          - "It no longer needed resampling"
          - "Its accuracy got worse"
          - "It turned into a Kalman filter"
        answer: C
        explain: "Too few particles cannot represent the belief well, so the estimate becomes less accurate."

