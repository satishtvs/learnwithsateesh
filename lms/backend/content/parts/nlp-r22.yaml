      - {slug: u2-p2, title: "Part 2: Treebanks, a data-driven approach to syntax", youtube_id: DEDclgIEtCo}
      - {slug: u2-p3, title: "Part 3: Representation of syntactic structure", youtube_id: auQm3mwzW_Y}
      - {slug: u2-p4, title: "Part 4: Parsing algorithms, top-down, bottom-up and CKY", youtube_id: iQ7Xe6O9w_Q}
