# Natural Language Processing (JNTUH R22 CSE-AIML, III-II): the video parts.
# Ids are written by `python -m lws.package apply` (keys nlp-u1-p1 ...); keep the `youtube_id: null` placeholders.
# The course is hidden from students until it is published in the instructor admin.

course:
  slug: natural-language-processing-r22
  title: "Natural Language Processing: JNTUH R22 B.Tech CSE (AI&ML), III-II"
  description: "Unit-wise video parts and quizzes for Natural Language Processing (AM603PC), following Bikel and Zitouni, Multilingual Natural Language Processing Applications."

units:
  - code: U1
    title: "Finding the Structure of Words and Documents"
    label: "Unit - I"
    textbook_ref: "Bikel and Zitouni"
    parts:
      - {slug: u1-p1, title: "Part 1: Words and their components", youtube_id: At4UeRZfAFw}
      - {slug: u1-p2, title: "Part 2: Issues and challenges in finding word structure", youtube_id: KKAnGl2EBf4}
      - {slug: u1-p3, title: "Part 3: Morphological models", youtube_id: 904Y7v9T7qw}
      - {slug: u1-p4, title: "Part 4: Finding the structure of documents: sentences and topics", youtube_id: 33jtNLrrYJY}
      - {slug: u1-p5, title: "Part 5: Complexity of the approaches and performance measures", youtube_id: jMNvgVQ5Rb8}
      - {slug: u1-p6, title: "Part 6: Features, with unit summary", youtube_id: CpO4h4XOrpI}
  - code: U2
    title: "Syntax I"
    label: "Unit - II"
    textbook_ref: "Bikel and Zitouni"
    parts:
