  - code: U4
    title: "Semantic Parsing II"
    label: "Unit - IV"
    textbook_ref: "Bikel and Zitouni"
    parts:
      - {slug: u4-p1, title: "Part 1: Predicate-argument structure and semantic roles", youtube_id: null}
      - {slug: u4-p2, title: "Part 2: Semantic role labeling", youtube_id: null}
      - {slug: u4-p3, title: "Part 3: Meaning representation, logical forms", youtube_id: null}
      - {slug: u4-p4, title: "Part 4: Semantic networks, frames and graph-based meaning", youtube_id: null}
  - code: U5
    title: "Language Modeling"
    label: "Unit - V"
    textbook_ref: "Bikel and Zitouni"
    parts:
      - {slug: u5-p1, title: "Part 1: Language modeling and n-gram models", youtube_id: null}
