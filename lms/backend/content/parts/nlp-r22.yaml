  - code: U3
    title: "Syntax II and Semantic Parsing I"
    label: "Unit - III"
    textbook_ref: "Bikel and Zitouni"
    parts:
      - {slug: u3-p1, title: "Part 1: Models for ambiguity resolution in parsing", youtube_id: WMhJQ7__Fx8}
      - {slug: u3-p2, title: "Part 2: Discriminative models and parse reranking", youtube_id: ZBTMZLVpDEY}
      - {slug: u3-p3, title: "Part 3: Multilingual issues in parsing", youtube_id: 3ml2LY0lqxs}
      - {slug: u3-p4, title: "Part 4: Semantic parsing: introduction and interpretation", youtube_id: ojdXaTAuzjo}
      - {slug: u3-p5, title: "Part 5: System paradigms for semantic parsing", youtube_id: mrvNPoDvcJA}
