# Machine Learning (JNTUH R22 CSE-AIML, III-I): the video parts.
# Fill in `youtube_id` (the 11-character id from the YouTube link) once a video is uploaded, then run the seed.
# Parts without an id are skipped; units are created together with their first part.
# The course itself stays unpublished (hidden from students) until it is published in the instructor admin.

course:
  slug: machine-learning-r22
  title: "Machine Learning: JNTUH R22 B.Tech CSE (AI&ML), III-I"
  description: "Unit-wise video parts and quizzes for Machine Learning (AM502PC), following S. Marsland, Machine Learning: An Algorithmic Perspective, 2nd ed."

units:
  - code: U1
    title: "Learning and Linear Models"
    label: "Unit - I"
    textbook_ref: "Marsland ch. 1-3; Mitchell ch. 1-2"
    parts:
      - {slug: u1-p1, title: "Part 1: What is learning? Supervised learning and the neuron", youtube_id: v1l27KwpcOE, preview: true}
      - {slug: u1-p2, title: "Part 2: Designing a learning system", youtube_id: PgQeYBLzZzQ}
      - {slug: u1-p3, title: "Part 3: Concept learning and Find-S", youtube_id: Z7eJpFpCxK4}
      - {slug: u1-p4, title: "Part 4: Version spaces and candidate elimination", youtube_id: b5tOBF_yK_s}
      - {slug: u1-p5, title: "Part 5: The perceptron and linear separability", youtube_id: Sczab1fidLo}
      - {slug: u1-p6, title: "Part 6: Linear regression", youtube_id: M-nhlp9X8Zg}
  - code: U2
    title: "Neural Networks and Support Vector Machines"
    label: "Unit - II"
    textbook_ref: "Marsland ch. 4, 5, 8"
    parts:
      - {slug: u2-p1, title: "Part 1: The multi-layer perceptron and going forwards", youtube_id: w9WNbcCB9RE}
      - {slug: u2-p2, title: "Part 2: Back-propagation of error", youtube_id: gOZWVHSwzYg}
      - {slug: u2-p3, title: "Part 3: The multi-layer perceptron in practice", youtube_id: t7iLPVZvqo0}
      - {slug: u2-p4, title: "Part 4: Radial basis functions and splines", youtube_id: xYm2mlrp4nw}
      - {slug: u2-p5, title: "Part 5: Support vector machines", youtube_id: jTwweeBDP1g}
  - code: U3
    title: "Trees, Ensembles, Statistics and Unsupervised Learning"
    label: "Unit - III"
    textbook_ref: "Marsland ch. 12-13, 7"
    parts:
      - {slug: u3-p1, title: "Part 1: Decision trees, entropy and ID3", youtube_id: iVcQdsB3i38}
      - {slug: u3-p2, title: "Part 2: CART, Gini impurity and pruning", youtube_id: hOZr9sAGqyw}
      - {slug: u3-p3, title: "Part 3: Ensemble learning, bagging, random forests and boosting", youtube_id: l6Ukf7G4n4E}
      - {slug: u3-p4, title: "Part 4: Basic statistics and Gaussian mixture models", youtube_id: d-wHDD6XmM0}
      - {slug: u3-p5, title: "Part 5: Nearest neighbour methods", youtube_id: 0FaCRtFZgto}
      - {slug: u3-p6, title: "Part 6: Unsupervised learning and k-means", youtube_id: 6Vc4vat1yWc}
  - code: U4
    title: "Dimensionality Reduction and Evolutionary Learning"
    label: "Unit - IV"
    textbook_ref: "Marsland ch. 6, 10"
    parts:
      - {slug: u4-p1, title: "Part 1: Dimensionality reduction and linear discriminant analysis", youtube_id: pOMBJrVaamY}
      - {slug: u4-p2, title: "Part 2: Principal component analysis", youtube_id: 74P3Pvc3djU}
      - {slug: u4-p3, title: "Part 3: Factor analysis and independent component analysis", youtube_id: plVjY-kGVZs}
      - {slug: u4-p4, title: "Part 4: Isomap, locally linear embedding and least squares optimisation", youtube_id: IFvl6FQB6So}
      - {slug: u4-p5, title: "Part 5: Evolutionary learning and genetic algorithms", youtube_id: MjFTxSZIpJc}
      - {slug: u4-p6, title: "Part 6: Genetic operators and using genetic algorithms", youtube_id: F4b9htnruE4}
  - code: U5
    title: "Reinforcement Learning, Sampling and Graphical Models"
    label: "Unit - V"
    textbook_ref: "Marsland ch. 11, 15-16"
    parts:
      - {slug: u5-p1, title: "Part 1: Reinforcement learning and the Getting Lost example", youtube_id: UmPYpVmBqSQ}
      - {slug: u5-p2, title: "Part 2: MDP, Bellman equation, Q-learning and Sarsa", youtube_id: q9gtS8Q1rvI}
      - {slug: u5-p3, title: "Part 3: Sampling methods and Markov chain Monte Carlo", youtube_id: jX2DWlGS4NI}
      - {slug: u5-p4, title: "Part 4: Graphical models: Bayesian networks and Markov random fields", youtube_id: kJJkdobxVwU}
      - {slug: u5-p5, title: "Part 5: Hidden Markov models", youtube_id: CeRQzxD6BkM}
      - {slug: u5-p6, title: "Part 6: Tracking: Kalman filter and particle filter", youtube_id: CxYeLguuWXI}
