# Machine Learning (JNTUH R22 CSE-AIML, III-I): the video lessons.
# Fill in `youtube_id` (the 11-character id from the YouTube link) once a video is uploaded, then run the seed.
# Lessons without an id are skipped; chapters are created together with their first lesson.
# The course itself stays unpublished (hidden from students) until it is published in the instructor admin.

course:
  slug: machine-learning-r22
  title: "Machine Learning: JNTUH R22 B.Tech CSE (AI&ML), III-I"
  description: "Unit-wise video lessons and quizzes for Machine Learning (AM502PC), following S. Marsland, Machine Learning: An Algorithmic Perspective, 2nd ed."

chapters:
  - code: U1
    title: "Learning and Linear Models"
    unit: "Unit - I"
    textbook_ref: "Marsland ch. 1-3; Mitchell ch. 1-2"
    lessons:
      - {slug: u1-p1, title: "Part 1: What is learning? Supervised learning and the neuron", youtube_id: qVhszEep_j0, preview: true}
      - {slug: u1-p2, title: "Part 2: Designing a learning system", youtube_id: RGiu750_W0Y}
      - {slug: u1-p3, title: "Part 3: Concept learning and Find-S", youtube_id: 062ic9yXyC4}
      - {slug: u1-p4, title: "Part 4: Version spaces and candidate elimination", youtube_id: AqBYLOVjSr8}
      - {slug: u1-p5, title: "Part 5: The perceptron and linear separability", youtube_id: SPHa2KSOgHM}
      - {slug: u1-p6, title: "Part 6: Linear regression", youtube_id: e1zz1QYeCqQ}
  - code: U2
    title: "Neural Networks and Support Vector Machines"
    unit: "Unit - II"
    textbook_ref: "Marsland ch. 4, 5, 8"
    lessons:
      - {slug: u2-p1, title: "Part 1: The multi-layer perceptron and going forwards", youtube_id: wWPoc23-EC8}
      - {slug: u2-p2, title: "Part 2: Back-propagation of error", youtube_id: 7DLbpKzEQJc}
      - {slug: u2-p3, title: "Part 3: The multi-layer perceptron in practice", youtube_id: xvAqc8rAtTE}
      - {slug: u2-p4, title: "Part 4: Radial basis functions and splines", youtube_id: UCRjhS3EKQE}
      - {slug: u2-p5, title: "Part 5: Support vector machines", youtube_id: 7rOJy3B0F2U}
