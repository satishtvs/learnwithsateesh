services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lws
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lws}
      POSTGRES_DB: lws
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lws"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lws:${POSTGRES_PASSWORD:-lws}@db:5432/lws
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
